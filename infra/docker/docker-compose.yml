services:
  postgres:
    image: postgres:16-alpine
    container_name: moneyflow-postgres
    restart: always
    environment:
      POSTGRES_DB: moneyflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moneyflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ../../apps/backend
      dockerfile: ../../infra/docker/backend.Dockerfile
    container_name: moneyflow-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/moneyflow
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8080:8080"

  customer-web:
    build:
      context: ../..
      dockerfile: infra/docker/customer-web.Dockerfile
    container_name: moneyflow-customer-web
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"

  admin-web:
    build:
      context: ../..
      dockerfile: infra/docker/admin-web.Dockerfile
    container_name: moneyflow-admin-web
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
