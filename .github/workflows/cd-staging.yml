name: Publish Staging Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-staging-images
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Build and Publish Immutable Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      backend_digest: ${{ steps.build-backend.outputs.digest }}
      admin_digest: ${{ steps.build-admin.outputs.digest }}
      customer_digest: ${{ steps.build-customer.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute immutable image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: infra/docker/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/backend:staging-latest

      - name: Build and publish admin image
        id: build-admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/admin-web.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/admin-web:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/admin-web:staging-latest

      - name: Build and publish customer image
        id: build-customer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/customer-web.Dockerfile
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://tdmwkowftrdyugpqlmol.supabase.co
            # This is Supabase's browser-safe anon/publishable key, not a service-role secret.
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkbXdrb3dmdHJkeXVncHFsbW9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODY3ODQsImV4cCI6MjEwNzU2Mjc4NH0.aOQHMrKpab0CkT8kh37HZPdxyTEk7tCrORW8Tm_USbs
            NEXT_PUBLIC_MONEYFLOW_API_URL=https://staging.moneyflow-api.enako.cm
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/customer-web:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/customer-web:staging-latest

      - name: Publish deployment handoff
        run: |
          {
            echo "## Immutable images published"
            echo
            echo "Deploy these images to Staging using the controlled VPS runbook:"
            echo "- \`ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.tag }}\`"
            echo "- \`ghcr.io/${{ github.repository }}/admin-web:${{ steps.meta.outputs.tag }}\`"
            echo "- \`ghcr.io/${{ github.repository }}/customer-web:${{ steps.meta.outputs.tag }}\`"
            echo
            echo "No database migration or server deployment is performed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
