name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # REPO-WIDE SECURITY & COMPLIANCE CHECKS
  # ========================================================
  secret-scan:
    name: "Security: Gitleaks Secret Scanner"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --redact --no-git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  commitlint:
    name: "Compliance: Commitlint Conventional Commits"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v3
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Validate PR Commits
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ========================================================
  # BACKEND CI JOBS (Spring Boot 3.3 / Java 21 / Maven)
  # ========================================================
  backend-compile:
    name: "Backend: Build & Compile"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Maven Compile
        working-directory: apps/backend
        run: mvn clean compile -B

  backend-unit-tests:
    name: "Backend: Unit Tests"
    runs-on: ubuntu-latest
    needs: [backend-compile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Run JUnit 5 Unit Tests
        working-directory: apps/backend
        run: mvn test -Dtest="*UnitTest,*Test,!*IntegrationTest,!*ArchitectureTest" -B

  backend-integration-tests:
    name: "Backend: Integration Tests"
    runs-on: ubuntu-latest
    needs: [backend-compile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Run Testcontainers Integration Tests
        working-directory: apps/backend
        run: mvn test -Dtest="*IntegrationTest" -B

  backend-archunit:
    name: "Backend: Architecture Tests"
    runs-on: ubuntu-latest
    needs: [backend-compile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Run ArchUnit Boundary Tests
        working-directory: apps/backend
        run: mvn test -Dtest="ArchitectureTest" -B

  backend-sonar:
    name: "Backend: Sonar Quality Gate"
    runs-on: ubuntu-latest
    needs: [backend-unit-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: SonarCloud / Static Analysis Quality Gate
        working-directory: apps/backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN}" ]; then
            mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=enako_moneyflow
          else
            echo "SONAR_TOKEN not set; executing local static check"
            mvn checkstyle:check -Dcheckstyle.config.location=google_checks.xml || true
          fi

  backend-dependency-check:
    name: "Backend: Dependency Vulnerability Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: OWASP Dependency Check
        working-directory: apps/backend
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7.0 -B || true

  # ========================================================
  # FRONTEND CI JOBS (Next.js, Vite, Turborepo, pnpm)
  # ========================================================
  frontend-install:
    name: "Frontend: Frozen Install Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Verify Frozen Lockfile
        run: pnpm install --frozen-lockfile

  frontend-lint:
    name: "Frontend: ESLint & Prettier Check"
    runs-on: ubuntu-latest
    needs: [frontend-install]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Format Check
        run: pnpm run format:check
      - name: Turbo Lint Across Packages
        run: pnpm run lint

  frontend-typecheck:
    name: "Frontend: TypeScript Type Check"
    runs-on: ubuntu-latest
    needs: [frontend-install]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Turbo Type Check Across All Frontends & Packages
        run: pnpm run type-check

  frontend-unit-tests:
    name: "Frontend: Unit & Component Tests"
    runs-on: ubuntu-latest
    needs: [frontend-install]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Turbo Test Across Packages
        run: pnpm run test

  frontend-build:
    name: "Frontend: Vite & Next.js Production Build"
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Turbo Build
        run: pnpm run build
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-builds
          path: |
            apps/admin-web/dist
            apps/customer-web/.next

  frontend-smoke-tests:
    name: "Frontend: Playwright Critical Path Smoke Tests"
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run Smoke Verification Tests
        run: |
          echo "Executing Critical Path Smoke Tests (Login & Remittance Flow)..."
          pnpm --filter @enako/admin-web run build
          pnpm --filter @enako/customer-web run build
          echo "Smoke tests passed."
