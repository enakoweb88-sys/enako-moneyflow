name: Production Release Gate

on:
  workflow_dispatch:
    inputs:
      artifact_tag:
        description: "Eight-character immutable image tag that passed Staging verification"
        required: true
        type: string
      confirmation_text:
        description: 'Type "APPROVE-PRODUCTION-RELEASE" to prepare a release handoff'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-gate
  cancel-in-progress: false

jobs:
  release-gate:
    name: Validate Production Release Handoff
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://moneyflow.enako.cm
    steps:
      - name: Validate approval and immutable tag
        env:
          ARTIFACT_TAG: ${{ inputs.artifact_tag }}
          CONFIRMATION_TEXT: ${{ inputs.confirmation_text }}
        run: |
          test "$CONFIRMATION_TEXT" = "APPROVE-PRODUCTION-RELEASE"
          printf '%s' "$ARTIFACT_TAG" | grep -Eq '^[0-9a-f]{8}$'

      - name: Create release handoff summary
        env:
          ARTIFACT_TAG: ${{ inputs.artifact_tag }}
        run: |
          {
            echo "## Production release handoff approved"
            echo
            echo "Approved immutable tag: \`$ARTIFACT_TAG\`"
            echo
            echo "This workflow intentionally does not deploy, migrate, or access the production database."
            echo "Perform the documented VPS deployment only after peer approval and a maintenance decision."
          } >> "$GITHUB_STEP_SUMMARY"
