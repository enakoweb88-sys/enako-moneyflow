spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moneyflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true

app:
  security:
    data-encryption-secret: ${APP_DATA_ENCRYPTION_SECRET:moneyflow-local-development-encryption-key}
