spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: moneyflow

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moneyflow}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

server:
  port: ${PORT:8080}

app:
  email:
    resend:
      api-key: ${APP_EMAIL_RESEND_API_KEY:}
      from: ${APP_EMAIL_FROM:}
      reply-to: ${APP_EMAIL_REPLY_TO:}
  security:
    supabase:
      # Set APP_SECURITY_SUPABASE_ISSUER_URI to https://<project-ref>.supabase.co/auth/v1
      # in a deployed environment. Until then, protected endpoints remain inaccessible.
      enabled: ${APP_SECURITY_SUPABASE_ENABLED:false}
      issuer-uri: ${APP_SECURITY_SUPABASE_ISSUER_URI:}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://staging.moneyflow.enako.cm,https://staging.moneyflow-admin.enako.cm,https://moneyflow.enako.cm,https://moneyflow-admin.enako.cm}
