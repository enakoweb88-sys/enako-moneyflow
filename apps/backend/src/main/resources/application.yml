spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: moneyflow

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moneyflow}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

server:
  port: ${PORT:8080}

app:
  payments:
    pilot:
      minimum-xaf: ${APP_PAYMENTS_PILOT_MINIMUM_XAF:1}
      maximum-xaf: ${APP_PAYMENTS_PILOT_MAXIMUM_XAF:1000}
      daily-maximum-xaf: ${APP_PAYMENTS_PILOT_DAILY_MAXIMUM_XAF:5000}
    providers:
      mtn:
        enabled: ${MTN_MOMO_ENABLED:false}
        base-url: ${MTN_MOMO_BASE_URL:https://momoapi.momo.africa}
        target-environment: ${MTN_MOMO_TARGET_ENVIRONMENT:mtncameroon}
        callback-base-url: ${MTN_MOMO_CALLBACK_URL:}
        subscription-key: ${PRIMARY_KEY:}
        api-user: ${DEPOSIT_API_USER:}
        api-key: ${DEPOSIT_API_KEY:}
      pixipay:
        enabled: ${PIX_PAY_ENABLED:false}
        base-url: ${PIX_PAY_BASE_URL:}
        callback-base-url: ${PIX_PAY_CALLBACK_URL:}
        api-key: ${PIX_PAY_API_KEY:}
        orange-cm-cashin-service-id: ${PIX_PAY_ORANGE_CM_CASHIN_SERVICE_ID:}
    webhooks:
      delivery-enabled: ${APP_PAYMENTS_WEBHOOK_DELIVERY_ENABLED:true}
      worker-delay-ms: ${APP_PAYMENTS_WEBHOOK_WORKER_DELAY_MS:15000}
  email:
    resend:
      api-key: ${APP_EMAIL_RESEND_API_KEY:}
      from: ${APP_EMAIL_FROM:}
      reply-to: ${APP_EMAIL_REPLY_TO:}
  security:
    data-encryption-secret: ${APP_DATA_ENCRYPTION_SECRET:}
    supabase:
      # Set APP_SECURITY_SUPABASE_ISSUER_URI to https://<project-ref>.supabase.co/auth/v1
      # in a deployed environment. Until then, protected endpoints remain inaccessible.
      enabled: ${APP_SECURITY_SUPABASE_ENABLED:false}
      issuer-uri: ${APP_SECURITY_SUPABASE_ISSUER_URI:}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://staging.moneyflow.enako.cm,https://staging.moneyflow-admin.enako.cm,https://moneyflow.enako.cm,https://moneyflow-admin.enako.cm}
